<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voter Roll OCR – Live</title>
<style>
:root{--bg:#fafafa;--card:#fff;--t:#111;--t2:#666;--b:#e5e5e5;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#171717;--t:#eee;--t2:#999;--b:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:860px;margin:0 auto;padding:24px 16px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--t2);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.k{color:var(--t2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.v{font-size:24px;font-weight:600}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden;margin:12px 0 8px}.bar>i{display:block;height:100%;background:var(--acc);transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--b)}th{color:var(--t2);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}a{color:var(--acc);text-decoration:none}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.stale .dot{background:var(--bad)}
.scroll{overflow-x:auto}.yr{display:flex;justify-content:space-between;align-items:baseline}.yr h2{font-size:16px;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--b);background:transparent;color:var(--t2);cursor:pointer}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.muted{color:var(--t2);font-size:12px}
.wk{display:grid;grid-template-columns:110px 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--b)}.wk:last-child{border-bottom:0}
.wn{font-weight:600}.wn .dot{vertical-align:1px}.off .dot{background:var(--bad)}.wait .dot{background:var(--warn)}
.ws{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--t2)}.ws b{color:var(--t);font-weight:600}
.mini{height:6px;background:var(--b);border-radius:4px;overflow:hidden;margin:6px 0 4px}.mini>i{display:block;height:100%;background:var(--acc)}
@media(max-width:560px){.wk{grid-template-columns:1fr}}
.sect{margin:0 0 14px;flex-wrap:wrap}.sect button{font-size:14px;padding:6px 14px}
.ov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ov div.o{cursor:pointer;border:1px solid var(--b);border-radius:10px;padding:8px 10px}
.ov .t{font-size:12px;color:var(--t2)}.ov .p{font-size:18px;font-weight:600}.ov .mini{margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--t2);margin-top:8px}.chips b{color:var(--t)}
</style></head><body><main>
<h1>Voter Roll OCR – Live</h1><div class="sub" id="upd"><span class="dot"></span>loading…</div>
<div class="card" id="ovc"><div class="k" style="margin-bottom:8px">All datasets</div><div class="ov" id="ov"></div></div>
<div class="tabs sect" id="sect"><button data-s="p1" class="on">First page 2026·2025·2024</button><button data-s="asdd">ASDD (SIR 2026 deletions)</button><button data-s="s02">2002 SIR rolls</button></div>
<div id="sec_asdd" style="display:none"></div><div id="sec_s02" style="display:none"></div>
<div id="sec_p1">
<div id="years"></div>
<div class="card" id="wkc"><div class="yr" style="margin-bottom:4px"><div class="k">Machines</div><div class="muted" id="thr"></div></div><div id="wks"></div></div>
<div class="card" id="recc" style="display:none"><div class="k" style="margin-bottom:8px">Recent completions</div><div class="scroll"><table><tbody id="rec"></tbody></table></div></div>
<div class="card" id="errc" style="display:none"><div class="k" style="margin-bottom:8px">Skipped after errors</div><div class="scroll"><table><tbody id="errs"></tbody></table></div></div>
<div class="card"><div class="yr" style="margin-bottom:8px"><div class="k">Finished constituencies</div><div class="tabs" id="tabs"></div></div><div class="scroll"><table>
<thead><tr><th>Constituency</th><th class="n">Parts</th><th class="n">Electors</th><th class="n">Review</th><th class="n">Failed</th><th>Sheet</th></tr></thead>
<tbody id="done"></tbody></table></div></div>
</div>
</main><script>
const $=id=>document.getElementById(id),fmt=n=>(n||0).toLocaleString('en-IN');
const dur=s=>s==null?'–':s<60?Math.round(s)+'s':s<3600?Math.floor(s/60)+'m '+Math.round(s%60)+'s':Math.floor(s/3600)+'h '+Math.round(s%3600/60)+'m';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const acn=l=>parseInt(l)||0;
let base='',lastLive=0,tab=null,fromLive=false;
async function getStatus(){
 if(Date.now()-lastLive>60000){lastLive=Date.now();try{const l=await (await fetch('live.json?t='+Date.now(),{cache:'no-store'})).json();
   base=(l.tunnel&&!location.href.startsWith(l.tunnel))?l.tunnel.replace(/\/$/,'')+'/':''}catch(e){base=''}}
 if(base){try{const d=await (await fetch(base+'status.json?t='+Date.now(),{cache:'no-store'})).json(); fromLive=true; return d}catch(e){}}
 fromLive=false;
 return await (await fetch('status.json?t='+Date.now(),{cache:'no-store'})).json();
}
function setTab(y){tab=y;tick()}
async function tick(){try{
 const d=await getStatus(); P1=d; const R=d.runs||[], Y=d.years||{'2026':{total_constituencies:d.total_constituencies,done:d.done_constituencies}};
 const age=Date.now()/1000-d.updated_epoch, stale=age>(fromLive?180:900);
 $('upd').className='sub'+(stale?' stale':''); $('upd').innerHTML='<span class="dot"></span>'+(stale?'Pipeline idle/offline · last update ':fromLive?'Live · updated ':'Snapshot · updated ')+esc(d.updated);
 const ys=Object.keys(Y).sort().reverse(); if(!tab||!Y[tab])tab=ys[0];
 $('years').innerHTML=ys.map(y=>{const v=Y[y],t=v.total_constituencies,pct=t?100*v.done/t:0;
  return '<div class="card"><div class="yr"><h2>'+y+' rolls</h2><span class="muted">'+(t?pct.toFixed(0)+'% of constituencies'+(v.eta&&v.done<t?' · ETA '+esc(v.eta):''):'not started')+'</span></div>'+
  '<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="grid">'+
  '<div><div class="k">Constituencies</div><div class="v">'+v.done+' / '+(t||'–')+'</div></div>'+
  '<div><div class="k">Parts</div><div class="v">'+fmt(v.parts)+'</div></div>'+
  '<div><div class="k">Electors</div><div class="v">'+fmt(v.electors)+'</div></div>'+
  '<div><div class="k">Review · Failed</div><div class="v"><span class="'+(v.needs_review?'warn':'')+'">'+fmt(v.needs_review)+'</span> · <span class="'+(v.failed||v.errors?'bad':'')+'">'+fmt(v.failed+(v.errors||0))+'</span></div></div>'+
  '</div></div>'}).join('');
 const WK=d.workers||[];
 $('thr').textContent=d.all_done?'All done':(d.throughput_ac_per_hr?d.throughput_ac_per_hr+' constituencies/hour':'');
 $('wks').innerHTML=WK.map(w=>{const nm=w.worker==='box'?'Grok box':w.worker==='mac'?'MacBook':w.worker;
  if(w.age_s==null)return '<div class="wk off"><div class="wn"><span class="dot"></span>'+esc(nm)+'</div><div class="ws"><span>'+esc(w.phase)+'</span><span>'+(w.cores_total||'?')+' cores</span></div></div>';
  const off=w.age_s>600, slow=w.age_s>150, pct=w.total?100*w.processed/w.total:0, cb=w.cores_busy||0, ct=w.cores_total||'?', F=w.fetch;
  const cls=off?'off':(slow?'wait':'');
  const ocr=w.phase==='OCR', dl=!ocr&&F&&F.ac;
  const fl=F&&F.ac?('Downloading '+esc(F.ac)+(F.total?': '+fmt(F.done)+'/'+fmt(F.total)+' zips':'')+(F.mbps?' · '+F.mbps+' MB/s':'')):(w.prefetch?'Next: '+esc(w.prefetch):'');
  return '<div class="wk '+cls+'"><div class="wn"><span class="dot"></span>'+esc(nm)+'<div class="muted">'+(off?'offline · last seen '+dur(w.age_s)+' ago':slow?'heartbeat late · '+dur(w.age_s):'live · '+dur(w.age_s)+' ago')+'</div></div><div>'+
   '<div><b>'+esc(ocr?'OCR':dl?'Downloading':(w.phase||''))+'</b>'+(ocr&&w.ac?' · '+esc(w.ac)+' <span class="muted">'+esc(w.year)+'</span>':dl?' · '+esc(F.ac)+' <span class="muted">'+esc(F.year)+'</span>':'')+'</div>'+
   (ocr?'<div class="mini"><i style="width:'+pct.toFixed(1)+'%"></i></div>':dl&&F.total?'<div class="mini"><i style="width:'+(100*F.done/F.total).toFixed(1)+'%;background:var(--ok)"></i></div>':'')+
   '<div class="ws"><span>Cores <b>'+cb+'/'+ct+'</b></span><span>Load <b>'+(w.load1!=null?w.load1:'–')+'</b></span>'+
   (ocr?'<span>Parts <b>'+fmt(w.processed)+'/'+fmt(w.total)+'</b></span><span><b>'+(w.parts_per_min||0)+'</b>/min</span>':'')+
   (dl&&F.total?'<span>Zips <b>'+fmt(F.done)+'/'+fmt(F.total)+'</b></span><span><b>'+(F.mbps||0)+'</b> MB/s</span>':'')+
   (w.done_session!=null?'<span>Done this run <b>'+w.done_session+'</b></span>':'')+'</div>'+
   (((ocr&&fl)||(w.uploading&&w.uploading.length))?'<div class="muted">'+(ocr?fl:'')+(ocr&&fl&&w.uploading&&w.uploading.length?' · ':'')+(w.uploading&&w.uploading.length?'Uploading: '+esc(w.uploading.join(', ')):'')+'</div>':'')+
   '</div></div>'}).join('')||'<div class="muted">No workers reporting</div>';
 const RC=d.recent||[];$('recc').style.display=RC.length?'':'none';
 $('rec').innerHTML=RC.map(x=>'<tr><td>'+esc(x.ac)+' <span class="muted">'+esc(x.year)+'</span></td><td class="muted">'+esc(x.worker==='box'?'Grok box':x.worker==='mac'?'MacBook':x.worker)+'</td><td class="n">'+fmt(x.parts)+' parts</td><td class="n muted">'+esc((x.finished||'').slice(11,16))+' IST</td></tr>').join('');
 const E=R.filter(r=>r.state==='error');$('errc').style.display=E.length?'':'none';
 $('errs').innerHTML=E.map(r=>'<tr><td>'+esc(r.label)+' <span class="muted">'+esc(r.year)+'</span></td><td class="bad">'+esc(r.error)+'</td></tr>').join('');
 $('tabs').innerHTML=ys.length>1?ys.map(y=>'<button class="'+(y===tab?'on':'')+'" onclick="setTab(\''+y+'\')">'+y+'</button>').join(''):'';
 $('done').innerHTML=R.filter(r=>r.state==='done'&&r.year===tab).sort((a,b)=>acn(a.label)-acn(b.label)).map(r=>'<tr><td>'+esc(r.label)+'<div class="muted">'+esc(r.district)+'</div></td><td class="n">'+fmt(r.processed)+'</td><td class="n">'+(r.electors==null?'–':fmt(r.electors))+'</td><td class="n'+(r.needs_review?' warn':'')+'">'+r.needs_review+'</td><td class="n'+(r.failed?' bad':'')+'">'+r.failed+'</td><td>'+(r.sheet?'<a href="'+esc(r.sheet)+'" target="_blank" rel="noopener">Sheet</a>':'')+(r.folder?' · <a href="'+esc(r.folder)+'" target="_blank" rel="noopener">Folder</a>':'')+'</td></tr>').join('')||'<tr><td class="muted" colspan="6">None yet</td></tr>';
}catch(e){$('upd').className='sub stale';$('upd').innerHTML='<span class="dot"></span>Cannot reach status ('+esc(e.message)+')'}}

let sect=localStorage.getItem('sect')||'p1';
document.querySelectorAll('#sect button').forEach(b=>b.onclick=()=>{sect=b.dataset.s;localStorage.setItem('sect',sect);showSect();renderNS()});
function showSect(){document.querySelectorAll('#sect button').forEach(b=>b.className=b.dataset.s===sect?'on':'');
 $('sec_p1').style.display=sect==='p1'?'':'none';$('sec_asdd').style.display=sect==='asdd'?'':'none';$('sec_s02').style.display=sect==='s02'?'':'none'}
showSect();
let NS=null,P1=null;
async function getNS(){
 if(base){try{const d=await (await fetch(base+'newsets.json?t='+Date.now(),{cache:'no-store'})).json();return d}catch(e){}}
 try{return await (await fetch('newsets.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){return null}}
const wname=w=>w==='box'?'Grok box':w==='boxweb'?'Grok box (web fetch)':w==='mac'?'MacBook':w;
function wkRows(WK,kind){return WK.map(w=>{const off=w.age_s>600,slow=w.age_s>150,cls=off?'off':(slow?'wait':''),pr=w.phase==='processing',pct=w.total?100*w.processed/w.total:0,F=w.fetch,DL=w.dl;
 return '<div class="wk '+cls+'"><div class="wn"><span class="dot"></span>'+esc(wname(w.worker))+'<div class="muted">'+(off?'offline · last seen '+dur(w.age_s)+' ago':slow?'heartbeat late · '+dur(w.age_s):'live · '+dur(w.age_s)+' ago')+'</div></div><div>'+
 '<div><b>'+esc(pr?(kind==='s02'?'Reading page 1':'Parsing'):(w.phase||''))+'</b>'+(pr&&w.unit?' · '+esc(w.unit):'')+'</div>'+
 (pr?'<div class="mini"><i style="width:'+pct.toFixed(1)+'%"></i></div>':'')+
 '<div class="ws"><span>Cores <b>'+(pr?(w.procs||1):0)+'/'+(w.cores||'?')+'</b></span><span>Load <b>'+(w.load1!=null?w.load1:'–')+'</b></span>'+
 (pr?'<span>'+(kind==='s02'?'PDFs':'Parts')+' <b>'+fmt(w.processed)+'/'+fmt(w.total)+'</b></span>':'')+(pr&&w.rate?'<span><b>'+w.rate+'</b>/min</span>':'')+
 (DL?'<span>Official site: <b>'+fmt(DL.ok)+'</b> fetched · <b>'+DL.active+'</b> in flight · <b>'+DL.per_min+'</b>/min'+(DL.err?' · <span class="warn">'+DL.err+' retries</span>':'')+(DL.backoff>=8?' · <span class="bad">backing off</span>':'')+'</span>':'')+
 '<span>Done this run <b>'+(w.done_session||0)+'</b></span></div>'+
 ((F&&F.unit)||w.prefetch||(w.uploading&&w.uploading.length)?'<div class="muted">'+(F&&F.unit?'Fetching '+esc(F.unit)+' ('+esc(F.stage||'')+(F.mb?' · '+F.mb+' MB':'')+')':w.prefetch?'Next: '+esc(w.prefetch):'')+(w.uploading&&w.uploading.length?' · Uploading: '+esc(w.uploading.join(', ')):'')+'</div>':'')+
 (w.errors&&w.errors.length?'<div class="muted bad">'+esc(w.errors.slice(-1)[0])+'</div>':'')+'</div></div>'}).join('')||'<div class="muted">No machines reporting yet</div>'}
function card(title,inner){return '<div class="card"><div class="k" style="margin-bottom:8px">'+title+'</div>'+inner+'</div>'}
function renderASDD(a){if(!a)return '';const pct=100*a.done/a.total,R=a.reasons||{},G=a.gender||{};
 let h='<div class="card"><div class="yr"><h2>ASDD lists · SIR 2026</h2><span class="muted">'+(a.all_done?'complete':pct.toFixed(0)+'% of constituencies'+(a.eta?' · ETA '+esc(a.eta):''))+'</span></div><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
 '<div class="grid"><div><div class="k">Constituencies</div><div class="v">'+a.done+' / '+a.total+'</div></div><div><div class="k">Parts</div><div class="v">'+fmt(a.parts+(a.parts_in_progress||0))+'</div><div class="muted">of '+fmt(a.parts_expected)+' (5 missing at source)</div></div>'+
 '<div><div class="k">Deleted electors (rows)</div><div class="v">'+fmt(a.rows)+'</div>'+(a.electors_2025?'<div class="muted">'+(100*a.rows/a.electors_2025).toFixed(2)+'% of 2025 roll</div>':'')+'</div><div><div class="k">Review · Failed</div><div class="v"><span class="'+(a.review?'warn':'')+'">'+fmt(a.review)+'</span> · <span class="'+(a.failed?'bad':'')+'">'+a.failed+'</span></div><div class="muted">rows · constituencies</div></div></div>'+
 '<div class="chips"><span>Dead <b>'+fmt(R.dead)+'</b></span><span>Shifted <b>'+fmt(R.shifted)+'</b></span><span>Absent <b>'+fmt(R.absent)+'</b></span><span>Duplicate <b>'+fmt(R.duplicate)+'</b></span><span>Male <b>'+fmt(G.male)+'</b></span><span>Female <b>'+fmt(G.female)+'</b></span>'+(G.third_gender?'<span>Third gender <b>'+fmt(G.third_gender)+'</b></span>':'')+'</div></div>';
 h+=card('Machines'+(a.units_per_hr?' <span class="muted">· '+a.units_per_hr+' constituencies/hour</span>':''),wkRows(a.workers||[],'asdd'));
 if(a.recent&&a.recent.length)h+=card('Recent completions','<div class="scroll"><table><tbody>'+a.recent.map(x=>'<tr><td>'+esc(x.l)+'</td><td class="muted">'+esc(wname(x.w))+'</td><td class="n">'+fmt(x.p)+' parts</td><td class="n">'+fmt(x.r)+' rows</td><td class="n muted">'+esc(x.t)+' IST</td></tr>').join('')+'</tbody></table></div>');
 if(a.failures&&a.failures.length)h+=card('Skipped after errors (retried automatically)','<div class="scroll"><table><tbody>'+a.failures.map(x=>'<tr><td>'+esc(x.l)+'</td><td class="bad">'+esc(x.e)+'</td><td class="n muted">try '+(x.a||1)+'</td></tr>').join('')+'</tbody></table></div>');
 h+=card('Finished constituencies','<div class="scroll"><table><thead><tr><th>Constituency</th><th class="n">Parts</th><th class="n">Rows</th><th class="n">Dead</th><th class="n">Shifted</th><th class="n">Absent</th><th class="n">Dup.</th><th class="n">% of 2025</th><th>Sheets</th></tr></thead><tbody>'+
  ((a.units||[]).map(u=>'<tr><td>'+esc(u.l)+'<div class="muted">'+esc(u.d)+(u.rv?' · <span class="warn">'+u.rv+' review</span>':'')+(u.mp?' · '+u.mp+' part missing at source':'')+'</div></td><td class="n">'+fmt(u.p)+'</td><td class="n">'+fmt(u.r)+'</td><td class="n">'+fmt(u.dead)+'</td><td class="n">'+fmt(u.sh)+'</td><td class="n">'+fmt(u.ab)+'</td><td class="n">'+fmt(u.du)+'</td><td class="n">'+(u.rate===''||u.rate==null?'–':u.rate)+'</td><td>'+
  (u.s?'<a href="'+esc(u.s)+'" target="_blank" rel="noopener">Rows</a>':'')+(u.ss?' · <a href="'+esc(u.ss)+'" target="_blank" rel="noopener">Parts</a>':'')+(u.so?' · <a href="'+esc(u.so)+'" target="_blank" rel="noopener">Old parts</a>':'')+(u.f?' · <a href="'+esc(u.f)+'" target="_blank" rel="noopener">Folder</a>':'')+'</td></tr>').join('')||'<tr><td class="muted" colspan="9">None yet</td></tr>')+'</tbody></table></div>');
 return h}
let dtab=null;function setD(d){dtab=d;renderNS()}
function renderS02(s){if(!s)return '';const pct=100*s.done/s.total,wp=s.web_total?100*(s.web_done+s.web_in_progress)/s.web_total:0;
 let h='<div class="card"><div class="yr"><h2>2002 SIR rolls · page 1</h2><span class="muted">'+(s.all_done?'complete':pct.toFixed(0)+'% of constituencies'+(s.eta?' · ETA '+esc(s.eta):''))+'</span></div><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
 '<div class="grid"><div><div class="k">Constituencies (2002)</div><div class="v">'+s.done+' / '+s.total+'</div></div><div><div class="k">Polling-station PDFs</div><div class="v">'+fmt(s.docs_done)+'</div><div class="muted">of '+fmt(s.docs_total)+'</div></div>'+
 '<div><div class="k">Electors (2002)</div><div class="v">'+fmt(s.electors)+'</div><div class="muted">M '+fmt(s.male)+' · F '+fmt(s.female)+'</div></div><div><div class="k">Review · Failed</div><div class="v"><span class="'+(s.review?'warn':'')+'">'+fmt(s.review)+'</span> · <span class="'+(s.failed_docs||s.failed?'bad':'')+'">'+fmt(s.failed_docs)+(s.failed?' + '+s.failed+' AC':'')+'</span></div><div class="muted">PDFs</div></div></div>'+
 '<div style="margin-top:12px"><div class="k">Official-site download (not on Drive)</div><div class="mini" style="height:8px"><i style="width:'+wp.toFixed(1)+'%;background:var(--ok)"></i></div><div class="muted">'+fmt(s.web_done+s.web_in_progress)+' / '+fmt(s.web_total)+' PDFs fetched · '+s.dl_per_min+' PDFs/min across machines · each PDF deleted after page 1 is read</div></div></div>';
 h+=card('Machines',wkRows(s.workers||[],'s02'));
 h+=card('Districts (2002 boundaries)','<div class="scroll"><table><thead><tr><th>District</th><th class="n">ACs</th><th class="n">PDFs</th><th class="n">Electors</th><th>Source</th></tr></thead><tbody>'+(s.districts||[]).map(d=>'<tr><td>'+esc(d.name)+'</td><td class="n">'+d.done+' / '+d.units+'</td><td class="n">'+fmt(d.docs_done)+' / '+fmt(d.docs)+'</td><td class="n">'+fmt(d.electors)+'</td><td class="muted">'+(d.web===0?'Drive':d.web===d.docs?'official site':'Drive + site')+'</td></tr>').join('')+'</tbody></table></div>');
 if(s.recent&&s.recent.length)h+=card('Recent completions','<div class="scroll"><table><tbody>'+s.recent.map(x=>'<tr><td>'+esc(x.l)+'</td><td class="muted">'+esc(wname(x.w))+'</td><td class="n">'+fmt(x.p)+' PDFs</td><td class="n">'+fmt(x.e)+' electors</td><td class="n muted">'+esc(x.t)+' IST</td></tr>').join('')+'</tbody></table></div>');
 if(s.failures&&s.failures.length)h+=card('Skipped after errors (retried automatically)','<div class="scroll"><table><tbody>'+s.failures.map(x=>'<tr><td>'+esc(x.l)+'</td><td class="bad">'+esc(x.e)+'</td><td class="n muted">try '+(x.a||1)+'</td></tr>').join('')+'</tbody></table></div>');
 const ds=[...new Set((s.units||[]).map(u=>u.d))];if(!dtab||ds.indexOf(dtab)<0)dtab=ds[0];
 h+='<div class="card"><div class="yr" style="margin-bottom:8px"><div class="k">Finished 2002 constituencies</div></div><div class="tabs" style="flex-wrap:wrap">'+ds.map(d=>'<button class="'+(d===dtab?'on':'')+'" onclick="setD(\''+esc(d)+'\')">'+esc(d)+'</button>').join('')+'</div><div class="scroll"><table><thead><tr><th>AC (2002)</th><th class="n">PDFs</th><th class="n">Electors</th><th class="n">Women booths</th><th class="n">Review</th><th>Sheet</th></tr></thead><tbody>'+
  ((s.units||[]).filter(u=>u.d===dtab).map(u=>'<tr><td>'+esc(u.l)+(u.nm?'<div class="muted">'+esc(u.nm)+'</div>':'')+'</td><td class="n">'+fmt(u.p)+'</td><td class="n">'+fmt(u.e)+'</td><td class="n">'+fmt(u.wb)+'</td><td class="n'+(u.rv?' warn':'')+'">'+(u.rv||0)+(u.fl?' <span class="bad">+'+u.fl+' failed</span>':'')+'</td><td>'+(u.s?'<a href="'+esc(u.s)+'" target="_blank" rel="noopener">Sheet</a>':'')+(u.f?' · <a href="'+esc(u.f)+'" target="_blank" rel="noopener">Folder</a>':'')+'</td></tr>').join('')||'<tr><td class="muted" colspan="6">None yet</td></tr>')+'</tbody></table></div></div>';
 return h}
function ovItem(key,t,done,tot,extra){const p=tot?100*done/tot:0;return '<div class="o" onclick="sect=\''+key+'\';localStorage.setItem(\'sect\',sect);showSect();renderNS()"><div class="t">'+t+'</div><div class="p">'+done+' / '+tot+'</div><div class="mini"><i style="width:'+p.toFixed(1)+'%'+(done>=tot&&tot?';background:var(--ok)':'')+'"></i></div><div class="muted">'+extra+'</div></div>'}
function renderNS(){const a=NS&&NS.asdd,s=NS&&NS.sir2002;let o='';
 if(P1){const Y=P1.years||{};['2026','2025','2024'].forEach(y=>{if(Y[y])o+=ovItem('p1','First page '+y,Y[y].done,Y[y].total_constituencies||0,fmt(Y[y].parts)+' parts')})}
 if(a)o+=ovItem('asdd','ASDD lists (SIR 2026)',a.done,a.total,fmt(a.rows)+' deleted electors'+(a.eta&&!a.all_done?' · ETA '+esc(a.eta.split(', ')[1]||a.eta):''));
 if(s)o+=ovItem('s02','2002 SIR rolls',s.done,s.total,fmt(s.docs_done)+' PDFs'+(s.eta&&!s.all_done?' · ETA '+esc(s.eta):''));
 $('ov').innerHTML=o;
 if(sect==='asdd')$('sec_asdd').innerHTML=renderASDD(a)||'<div class="card muted">Waiting for data…</div>';
 if(sect==='s02')$('sec_s02').innerHTML=renderS02(s)||'<div class="card muted">Waiting for data…</div>';}
async function tickNS(){NS=await getNS();renderNS()}
tick();setInterval(tick,4000);setTimeout(tickNS,800);setInterval(tickNS,8000);
</script></body></html>
